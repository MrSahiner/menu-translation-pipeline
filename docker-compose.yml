# Yerel çalıştırma için PostgreSQL ve Redis. Testler kendi kapsayıcılarını Testcontainers ile açar.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: menu_translation
    ports:
      - "5442:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
